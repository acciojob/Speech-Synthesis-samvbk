<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="voiceinator">

      <h1>The Voiceinator 5000</h1>

      <select name="voice" id="voices">
        <option value="">Select A Voice</option>
      </select>

      <label for="rate">Rate:<span id="rateValue">1x</span></label>
      <input name="rate" id="speedRate" type="range" min="0" max="3" value="1" step="0.1">

      <label for="pitch">Pitch: <span id="pitchValue">1</label>
      <input name="pitch" id="pitchTone" type="range" min="0" max="2" step="0.1">
		
      <textarea name="text">Hello! I love JavaScript 👍</textarea>
      <button id="stop">Stop!</button>
      <button id="speak">Speak</button>

    </div>

</script>

</body>
</html>
